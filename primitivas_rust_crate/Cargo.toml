[package]
name = "primitivas_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "primitivas_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
aes-gcm = { version = "0.10", features = ["zeroize"] } 
zeroize = "1" 